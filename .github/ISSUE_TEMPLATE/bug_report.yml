name: Bug report
description: Something is not working as expected.
labels: ["bug"]
body:
  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options:
        - Linux
        - macOS
        - Windows (Command Prompt)
        - Windows (PowerShell)
    validations:
      required: true

  - type: input
    id: java_version
    attributes:
      label: Java version
      description: Output of `java -version`
      placeholder: openjdk 21.0.3
    validations:
      required: true

  - type: input
    id: command
    attributes:
      label: Command you ran
      placeholder: ./runner.sh HelloWorld.java --watch
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: What happened
      description: Paste the terminal output.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations:
      required: true
